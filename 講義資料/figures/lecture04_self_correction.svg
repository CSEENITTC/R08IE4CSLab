<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #1e293b; }
      .bold-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .title-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .wire-label { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12px; font-weight: bold; }
      .sub-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .wire { stroke: #2563eb; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-error { stroke: #dc2626; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .feedback-wire { stroke: #dc2626; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .shadow { filter: drop-shadow(0px 3px 6px rgba(0, 0, 0, 0.06)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="regBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="checkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect x="10" y="10" width="660" height="250" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- MUX before State Register (Selects between Next Normal State vs Recovery State) -->
  <g class="shadow" transform="translate(140, 50)">
    <polygon points="0,0 45,12 45,68 0,80" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="22" y="45" text-anchor="middle" class="bold-label" fill="#b91c1c" font-size="11">MUX</text>
    <text x="7" y="24" class="sub-label" font-size="9">0</text>
    <text x="7" y="68" class="sub-label" font-size="9">1</text>
  </g>

  <!-- Normal Shift/Next Input (to MUX in0) -->
  <path d="M 30, 65 L 140, 65" class="wire" marker-end="url(#arrow)"/>
  <text x="25" y="60" class="wire-label" fill="#2563eb">nextState (通常シフト)</text>

  <!-- State Register Block -->
  <g class="shadow" transform="translate(240, 40)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="url(#regBg)" stroke="#3b82f6" stroke-width="2"/>
    <text x="70" y="32" text-anchor="middle" class="title-label">stateReg</text>
    <text x="70" y="55" text-anchor="middle" class="bold-label" fill="#1e40af">状態レジスタ</text>
    <text x="70" y="80" text-anchor="middle" class="sub-label">4-bit D-FF</text>
  </g>

  <!-- MUX to State Register -->
  <path d="M 185, 90 L 240, 90" class="wire" marker-end="url(#arrow)"/>

  <!-- State Register Output to Checker -->
  <path d="M 380, 90 L 440, 90" class="wire" marker-end="url(#arrow)"/>
  <circle cx="410" cy="90" r="3.5" fill="#2563eb"/>
  <!-- Output Wire branching out -->
  <path d="M 410, 90 L 410, 30 L 610, 30" class="wire" marker-end="url(#arrow)"/>
  <text x="615" y="34" class="wire-label" fill="#16a34a">io.out (カウント出力)</text>

  <!-- Checker Logic Block (PopCount === 1) -->
  <g class="shadow" transform="translate(440, 50)">
    <rect x="0" y="0" width="180" height="80" rx="10" fill="url(#checkBg)" stroke="#ef4444" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" class="title-label" fill="#b91c1c">正常性検査論理</text>
    <text x="90" y="50" text-anchor="middle" class="wire-label" fill="#991b1b">PopCount(state) === 1</text>
    <text x="90" y="68" text-anchor="middle" class="sub-label">1-hot 違反の検知</text>
  </g>

  <!-- Error Detected Signal (Exits Checker downwards, returns from BOTTOM to MUX) -->
  <path d="M 530, 130 L 530, 200 L 162, 200 L 162, 130" class="feedback-wire" marker-end="url(#arrow-error)"/>
  <text x="340" y="190" text-anchor="middle" class="bold-label" fill="#dc2626">
    不正状態検出 (エラー = !isOneHot) ───【下から戻る保護フィードバック】
  </text>

  <!-- Forced Recovery Data to MUX in1 -->
  <path d="M 50, 110 L 140, 110" class="wire-error" marker-end="url(#arrow-error)"/>
  <text x="45" y="105" text-anchor="end" class="wire-label" fill="#dc2626">"b0001".U (初期値強制ロード)</text>

  <!-- Footnote -->
  <text x="340" y="240" text-anchor="middle" class="sub-label" font-weight="bold" fill="#64748b">
    α線やノイズで不正状態に陥っても、次クロックで自律的に正常パターンへ自動復帰
  </text>
</svg>
