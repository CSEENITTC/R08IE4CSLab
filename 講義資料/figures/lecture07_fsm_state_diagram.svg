<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
    .wire-label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; fill: #2563eb; font-weight: 600; }
    .wire { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-subtle { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .wire-clk { stroke: #0284c7; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
    .feedback-wire { stroke: #2563eb; stroke-width: 2.2; fill: none; }
    .box-comb { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .box-seq { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.8; rx: 6; filter: url(#shadow); }
    .box-ctrl { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .box-mem { fill: #fff7ed; stroke: #f97316; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .box-bad { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.8; rx: 8; }
    .gate { fill: #ffffff; stroke: #1e40af; stroke-width: 1.8; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arrow-subtle" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background plate -->
  <rect width="760" height="220" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.2"/>

  <circle cx="100" cy="110" r="45" fill="#f8fafc" stroke="#3b82f6" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="100" y="108" class="title">sIDLE</text>
  <text x="100" y="125" class="subtitle">out=0</text>

  <circle cx="280" cy="110" r="45" fill="#f8fafc" stroke="#3b82f6" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="280" y="108" class="title">s1</text>
  <text x="280" y="125" class="subtitle">out=0</text>

  <circle cx="460" cy="110" r="45" fill="#f8fafc" stroke="#3b82f6" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="460" y="108" class="title">s10</text>
  <text x="460" y="125" class="subtitle">out=0</text>

  <circle cx="640" cy="110" r="45" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="640" y="105" class="title" style="fill:#166534;">s101</text>
  <text x="640" y="125" class="label" style="fill:#16a34a; font-size:11px;">detected=1</text>

  <!-- Transitions Forward -->
  <path d="M 145,100 L 235,100" class="wire" marker-end="url(#arrow)"/>
  <text x="190" y="92" class="wire-label" text-anchor="middle">in=1</text>

  <path d="M 325,100 L 415,100" class="wire" marker-end="url(#arrow)"/>
  <text x="370" y="92" class="wire-label" text-anchor="middle">in=0</text>

  <path d="M 505,100 L 595,100" class="wire" marker-end="url(#arrow)"/>
  <text x="550" y="92" class="wire-label" text-anchor="middle">in=1</text>

  <!-- Self Loops -->
  <path d="M 80,68 C 65,30 135,30 120,68" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <text x="100" y="30" class="wire-label" text-anchor="middle">in=0</text>

  <path d="M 260,68 C 245,30 315,30 300,68" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <text x="280" y="30" class="wire-label" text-anchor="middle">in=1</text>

  <!-- Transitions Backward (Bottom Feedback) -->
  <path d="M 440,150 C 380,185 180,185 120,150" class="feedback-wire" marker-end="url(#arrow)"/>
  <text x="280" y="195" class="wire-label" text-anchor="middle">in=0 (ミスマッチ)</text>

  <path d="M 610,145 C 550,210 370,210 300,150" class="feedback-wire" style="stroke:#16a34a;" marker-end="url(#arrow-green)"/>
  <text x="470" y="212" class="wire-label" style="fill:#16a34a;" text-anchor="middle">in=1 (オーバーラップ検出: "10101")</text>

</svg>