<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; fill: #1e293b; }
      .bold-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: bold; fill: #0f172a; }
      .cnt-text { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 12px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .wave { stroke: #2563eb; stroke-width: 3; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
      .dim-line { stroke: #475569; stroke-width: 1.5; fill: none; }
      .grid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4,4; }
      .fill-high { fill: #dbeafe; opacity: 0.7; }
      .cnt-box-high { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.2; }
      .cnt-box-low { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
    </style>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1.5 L 2 5 L 10 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="704" height="204" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Example Title -->
  <text x="360" y="28" text-anchor="middle" class="bold-label" fill="#1e3a8a">具体例: period = 4（1周期 = 0〜4 の 5クロック）、duty = 2（2クロック間 High）のとき</text>

  <!-- High Area Shading -->
  <rect x="90" y="135" width="120" height="55" class="fill-high"/>
  <rect x="390" y="135" width="120" height="55" class="fill-high"/>

  <!-- Grid Lines (every 60px from x=90 to x=690) -->
  <line x1="90"  y1="45" x2="90"  y2="195" class="grid" stroke="#64748b"/>
  <line x1="150" y1="75" x2="150" y2="195" class="grid"/>
  <line x1="210" y1="65" x2="210" y2="195" class="grid"/>
  <line x1="270" y1="75" x2="270" y2="195" class="grid"/>
  <line x1="330" y1="75" x2="330" y2="195" class="grid"/>
  <line x1="390" y1="45" x2="390" y2="195" class="grid" stroke="#64748b"/>
  <line x1="450" y1="75" x2="450" y2="195" class="grid"/>
  <line x1="510" y1="65" x2="510" y2="195" class="grid"/>
  <line x1="570" y1="75" x2="570" y2="195" class="grid"/>
  <line x1="630" y1="75" x2="630" y2="195" class="grid"/>
  <line x1="690" y1="45" x2="690" y2="195" class="grid" stroke="#64748b"/>

  <!-- Dimension: Period -->
  <path d="M 94, 52 L 386, 52" class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-dim)"/>
  <text x="240" y="47" text-anchor="middle" class="bold-label" fill="#1e40af">1周期 = period + 1 = 5 クロック</text>

  <path d="M 394, 52 L 686, 52" class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-dim)"/>
  <text x="540" y="47" text-anchor="middle" class="bold-label" fill="#1e40af">1周期 = period + 1 = 5 クロック</text>

  <!-- Dimension: Duty -->
  <path d="M 94, 72 L 206, 72" class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-dim)"/>
  <text x="150" y="67" text-anchor="middle" class="label" fill="#0369a1" font-weight="bold">duty = 2 クロック (High)</text>
  <text x="300" y="67" text-anchor="middle" class="label" fill="#64748b">残り 3 クロック (Low)</text>

  <path d="M 394, 72 L 506, 72" class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-dim)"/>
  <text x="450" y="67" text-anchor="middle" class="label" fill="#0369a1" font-weight="bold">duty = 2 クロック (High)</text>
  <text x="600" y="67" text-anchor="middle" class="label" fill="#64748b">残り 3 クロック (Low)</text>

  <!-- cntReg Row -->
  <text x="80" y="102" text-anchor="end" class="bold-label">cntReg</text>
  <!-- Cycle 1 boxes -->
  <rect x="90"  y="84" width="60" height="26" class="cnt-box-high"/><text x="120" y="102" class="cnt-text" fill="#1d4ed8">0 (&lt;2)</text>
  <rect x="150" y="84" width="60" height="26" class="cnt-box-high"/><text x="180" y="102" class="cnt-text" fill="#1d4ed8">1 (&lt;2)</text>
  <rect x="210" y="84" width="60" height="26" class="cnt-box-low"/><text x="240" y="102" class="cnt-text">2</text>
  <rect x="270" y="84" width="60" height="26" class="cnt-box-low"/><text x="300" y="102" class="cnt-text">3</text>
  <rect x="330" y="84" width="60" height="26" class="cnt-box-low"/><text x="360" y="102" class="cnt-text">4 (=period)</text>
  <!-- Cycle 2 boxes -->
  <rect x="390" y="84" width="60" height="26" class="cnt-box-high"/><text x="420" y="102" class="cnt-text" fill="#1d4ed8">0 (&lt;2)</text>
  <rect x="450" y="84" width="60" height="26" class="cnt-box-high"/><text x="480" y="102" class="cnt-text" fill="#1d4ed8">1 (&lt;2)</text>
  <rect x="510" y="84" width="60" height="26" class="cnt-box-low"/><text x="540" y="102" class="cnt-text">2</text>
  <rect x="570" y="84" width="60" height="26" class="cnt-box-low"/><text x="600" y="102" class="cnt-text">3</text>
  <rect x="630" y="84" width="60" height="26" class="cnt-box-low"/><text x="660" y="102" class="cnt-text">4 (=period)</text>

  <!-- PWM Digital Waveform -->
  <text x="80" y="142" text-anchor="end" class="label" font-family="monospace" fill="#2563eb" font-weight="bold">pwmOut=1</text>
  <text x="80" y="190" text-anchor="end" class="label" font-family="monospace" fill="#64748b">pwmOut=0</text>
  <path d="M 90, 190 L 90, 135 L 210, 135 L 210, 190 L 390, 190 L 390, 135 L 510, 135 L 510, 190 L 690, 190" class="wave"/>
</svg>
