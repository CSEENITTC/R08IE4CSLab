<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #1e293b; }
      .bold-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .wave { stroke: #2563eb; stroke-width: 3; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
      .dim-line { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 4,4; }
      .fill-high { fill: #eff6ff; }
      .shadow { filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.05)); }
    </style>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1.5 L 2 5 L 10 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="700" height="180" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- High Area Shading for Cycle 1 -->
  <rect x="70" y="80" width="140" height="70" class="fill-high"/>
  <rect x="370" y="80" width="140" height="70" class="fill-high"/>

  <!-- Grid Lines -->
  <line x1="70" y1="30" x2="70" y2="160" class="grid"/>
  <line x1="210" y1="50" x2="210" y2="160" class="grid"/>
  <line x1="370" y1="30" x2="370" y2="160" class="grid"/>
  <line x1="510" y1="50" x2="510" y2="160" class="grid"/>
  <line x1="670" y1="30" x2="670" y2="160" class="grid"/>

  <!-- Dimension: Period T -->
  <path d="M 75, 40 L 365, 40" class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-dim)"/>
  <text x="220" y="35" text-anchor="middle" class="bold-label" fill="#1e40af">周期 T (Period)</text>

  <path d="M 375, 40 L 665, 40" class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-dim)"/>
  <text x="520" y="35" text-anchor="middle" class="bold-label" fill="#1e40af">周期 T (Period)</text>

  <!-- Dimension: High / Duty -->
  <path d="M 75, 65 L 205, 65" class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-dim)"/>
  <text x="140" y="60" text-anchor="middle" class="label" fill="#0369a1" font-weight="bold">High (Duty幅)</text>

  <!-- Low Label -->
  <text x="290" y="60" text-anchor="middle" class="label" fill="#64748b">Low (消灯/オフ)</text>

  <!-- PWM Digital Waveform -->
  <path d="M 30, 150 L 70, 150 L 70, 80 L 210, 80 L 210, 150 L 370, 150 L 370, 80 L 510, 80 L 510, 150 L 670, 150 L 670, 80 L 690, 80" class="wave"/>

  <!-- Logic Levels -->
  <text x="55" y="85" text-anchor="end" class="label" font-family="monospace" fill="#2563eb" font-weight="bold">1 (High)</text>
  <text x="55" y="155" text-anchor="end" class="label" font-family="monospace" fill="#64748b">0 (Low)</text>

  <!-- Signal Name -->
  <text x="30" y="115" class="bold-label" fill="#0f172a">PWM 出力</text>
</svg>
