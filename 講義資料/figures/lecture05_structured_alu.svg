<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%">
  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
    .wire-label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; fill: #2563eb; font-weight: 600; }
    .wire { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-subtle { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .wire-clk { stroke: #0284c7; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
    .feedback-wire { stroke: #2563eb; stroke-width: 2.2; fill: none; }
    .box-comb { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .box-seq { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.8; rx: 6; filter: url(#shadow); }
    .box-ctrl { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .box-mem { fill: #fff7ed; stroke: #f97316; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .box-bad { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.8; rx: 8; }
    .gate { fill: #ffffff; stroke: #1e40af; stroke-width: 1.8; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arrow-subtle" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background plate -->
  <rect width="720" height="220" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.2"/>

  <text x="30" y="45" class="wire-label">a (8bit)</text>
  <line x1="85" y1="40" x2="200" y2="40" class="wire"/>
  <circle cx="200" cy="40" r="3.5" fill="#2563eb"/>
  <line x1="200" y1="40" x2="200" y2="70" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <line x1="200" y1="40" x2="480" y2="40" class="wire"/>
  <circle cx="480" cy="40" r="3.5" fill="#2563eb"/>
  <line x1="480" y1="40" x2="480" y2="70" class="wire-subtle" marker-end="url(#arrow-subtle)"/>

  <text x="30" y="65" class="wire-label">b (8bit)</text>
  <line x1="85" y1="60" x2="230" y2="60" class="wire"/>
  <circle cx="230" cy="60" r="3.5" fill="#2563eb"/>
  <line x1="230" y1="60" x2="230" y2="70" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <line x1="230" y1="60" x2="510" y2="60" class="wire"/>
  <circle cx="510" cy="60" r="3.5" fill="#2563eb"/>
  <line x1="510" y1="60" x2="510" y2="70" class="wire-subtle" marker-end="url(#arrow-subtle)"/>

  <rect x="150" y="70" width="170" height="60" class="box-comb"/>
  <text x="235" y="95" class="title">ArithmeticUnit</text>
  <text x="235" y="113" class="subtitle">(加算, 減算, +&amp;)</text>

  <rect x="430" y="70" width="170" height="60" class="box-comb"/>
  <text x="515" y="95" class="title">LogicUnit</text>
  <text x="515" y="113" class="subtitle">(AND, OR, XOR, NOT)</text>

  <line x1="235" y1="130" x2="235" y2="160" class="wire"/>
  <line x1="235" y1="160" x2="330" y2="160" class="wire" marker-end="url(#arrow)"/>
  <text x="245" y="152" class="wire-label">res, cout</text>

  <line x1="515" y1="130" x2="515" y2="160" class="wire"/>
  <line x1="515" y1="160" x2="430" y2="160" class="wire" marker-end="url(#arrow)"/>
  <text x="465" y="152" class="wire-label">res</text>

  <polygon points="330,145 430,145 410,180 350,180" class="gate"/>
  <text x="380" y="165" class="title" style="font-size:11px;">ALU MUX</text>

  <line x1="380" y1="210" x2="380" y2="180" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <text x="390" y="205" class="wire-label">aluSel (制御)</text>

  <line x1="410" y1="162" x2="620" y2="162" class="wire" marker-end="url(#arrow)"/>
  <text x="625" y="166" class="label">out, carryOut</text>

</svg>