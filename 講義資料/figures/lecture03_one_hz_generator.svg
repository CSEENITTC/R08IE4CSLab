<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
      .wire-label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; fill: #2563eb; font-weight: 600; }
      .wire { stroke: #2563eb; stroke-width: 2; fill: none; }
      .wire-out { stroke: #16a34a; stroke-width: 2.2; fill: none; }
      .wire-pulse { stroke: #d97706; stroke-width: 2.2; fill: none; }
      .wire-subtle { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .box-comb { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
      .box-seq { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.8; rx: 6; filter: url(#shadow); }
      .box-tgl { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.8; rx: 6; filter: url(#shadow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background plate -->
  <rect width="740" height="220" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- System Clock Note -->
  <text x="25" y="32" class="wire-label" style="fill:#0284c7;">System Clock: 9MHz (9,000,000 Hz)</text>

  <!-- Enable input -->
  <text x="20" y="85" class="wire-label">io.en</text>
  <line x1="65" y1="80" x2="110" y2="80" class="wire" marker-end="url(#arrow)"/>

  <!-- 9MHz Prescaler / Counter Block -->
  <rect x="110" y="50" width="220" height="75" class="box-comb"/>
  <text x="220" y="78" class="title">9MHz 周期カウンタ</text>
  <text x="220" y="98" class="subtitle">cntReg (0 〜 8,999,999)</text>
  <text x="220" y="114" class="subtitle" style="font-size:10px; fill:#2563eb;">half: 4,499,999 / full: 8,999,999</text>

  <!-- Output 1: 0.5s Toggle trigger to LED Reg -->
  <line x1="330" y1="75" x2="420" y2="75" class="wire" marker-end="url(#arrow)"/>
  <text x="375" y="68" class="subtitle" style="font-size:10px;">0.5秒毎 反転</text>

  <!-- LED Toggle Register (T-FF / RegInit) -->
  <rect x="420" y="50" width="130" height="55" class="box-tgl"/>
  <text x="485" y="75" class="title" style="fill:#854d0e;">LEDレジスタ</text>
  <text x="485" y="93" class="subtitle">ledReg (RegInit)</text>

  <!-- Wire from LED Reg to output -->
  <line x1="550" y1="75" x2="630" y2="75" class="wire-out" marker-end="url(#arrow-green)"/>
  <text x="635" y="72" class="label" style="fill:#15803d;">io.ledBlink</text>
  <text x="635" y="88" class="subtitle" style="text-anchor:start; fill:#16a34a;">0.5秒 点灯 / 0.5秒 消灯 (1Hz点滅)</text>

  <!-- Output 2: 1Hz Strobe Pulse -->
  <line x1="330" y1="105" x2="370" y2="105" class="wire"/>
  <line x1="370" y1="105" x2="370" y2="165" class="wire"/>
  <line x1="370" y1="165" x2="630" y2="165" class="wire-pulse" marker-end="url(#arrow-amber)"/>
  <text x="635" y="162" class="label" style="fill:#b45309;">io.oneHzPulse</text>
  <text x="635" y="178" class="subtitle" style="text-anchor:start; fill:#d97706;">1秒に1回・1クロック幅 (同期イネーブル用)</text>

  <!-- Clear input line from top -->
  <line x1="220" y1="20" x2="220" y2="50" class="wire" style="stroke:#dc2626;" marker-end="url(#arrow)"/>
  <text x="225" y="32" class="wire-label" style="fill:#dc2626;">io.clear (同期リセット)</text>
</svg>
