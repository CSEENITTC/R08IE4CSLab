<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" width="100%" height="100%">
  <style>
    .top-box { fill: #f8fafc; stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 6,4; rx: 12; }
    .mod-box { fill: #ffffff; stroke: #1e40af; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .state { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; filter: url(#shadow); }
    .state-init { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.5; filter: url(#shadow); }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .onehot { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 12.5px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
    .onehot-init { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 12.5px; font-weight: 700; fill: #15803d; text-anchor: middle; }
    .edge-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; fill: #334155; text-anchor: middle; }
    .sw-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #b45309; }
    .wire-label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; font-weight: 600; fill: #2563eb; }
    .arrow-line { stroke: #2563eb; stroke-width: 2; fill: none; }
    .reset-line { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 5,3; fill: none; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="760" height="285" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- TeCIO Top Module Boundary -->
  <rect x="115" y="12" width="525" height="260" class="top-box"/>
  <text x="315" y="32" class="title" style="fill:#1e40af;">TeCIO.scala: class FSMIO (OneHzGenerator.scala + FourStateFSM.scala)</text>

  <!-- Inputs: RUN_SW and RESET_SW -->
  <text x="14" y="65" class="sw-label">RUN_SW (P16)</text>
  <text x="14" y="80" class="wire-label">io.en</text>
  <line x1="95" y1="68" x2="145" y2="68" class="arrow-line" marker-end="url(#arrow)"/>

  <text x="14" y="125" class="sw-label" style="fill:#dc2626;">RESET_SW (P120)</text>
  <text x="14" y="140" class="wire-label" style="fill:#dc2626;">io.clear</text>
  <line x1="105" y1="128" x2="145" y2="128" class="reset-line" marker-end="url(#arrow-red)"/>

  <!-- OneHzGenerator Box -->
  <rect x="145" y="48" width="145" height="96" class="mod-box"/>
  <text x="217" y="72" class="title">OneHzGenerator</text>
  <text x="217" y="90" class="subtitle">(9MHz → 1Hz分周)</text>
  <text x="217" y="112" class="wire-label" style="text-anchor:middle;">ledBlink / oneHzPulse</text>

  <!-- OneHzGenerator -> RUN_LED -->
  <line x1="290" y1="68" x2="650" y2="68" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="465" y="61" class="wire-label" style="text-anchor:middle;">~oneHz.io.ledBlink</text>
  <text x="658" y="66" class="sw-label">RUN_LED (P43)</text>
  <text x="658" y="80" class="wire-label">io.runLED</text>

  <!-- oneHzPulse -> FourStateFSM (en) -->
  <line x1="290" y1="118" x2="350" y2="118" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="320" y="110" class="wire-label" style="text-anchor:middle;">oneHzPulse → en</text>

  <!-- FourStateFSM Box with 4 states -->
  <rect x="350" y="85" width="272" height="172" class="mod-box" style="fill:#fdfdfd;"/>
  <text x="486" y="106" class="title" style="fill:#1e3a8a;">FourStateFSM (fsm)</text>

  <!-- State s0 -->
  <circle cx="400" cy="148" r="28" class="state-init"/>
  <text x="400" y="145" class="title" style="font-size:12px;">s0</text>
  <text x="400" y="161" class="onehot-init">0001</text>

  <!-- s0 -> s1 -->
  <line x1="428" y1="148" x2="452" y2="148" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- State s1 -->
  <circle cx="480" cy="148" r="28" class="state"/>
  <text x="480" y="145" class="title" style="font-size:12px;">s1</text>
  <text x="480" y="161" class="onehot">0010</text>

  <!-- s1 -> s2 -->
  <line x1="508" y1="148" x2="532" y2="148" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- State s2 -->
  <circle cx="560" cy="148" r="28" class="state"/>
  <text x="560" y="145" class="title" style="font-size:12px;">s2</text>
  <text x="560" y="161" class="onehot">0100</text>

  <!-- s2 -> s3 -->
  <path d="M 560 176 Q 560 215 512 215" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- State s3 -->
  <circle cx="480" cy="215" r="28" class="state"/>
  <text x="480" y="212" class="title" style="font-size:12px;">s3</text>
  <text x="480" y="228" class="onehot">1000</text>

  <!-- s3 -> s0 -->
  <path d="M 452 215 Q 400 215 400 178" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="490" y="249" class="edge-label">en (1Hzパルス) ごとに4状態を巡回 / clear で s0 へ復帰</text>

  <!-- Output ~fsm.io.out -> DATA_LED -->
  <line x1="622" y1="165" x2="650" y2="165" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="658" y="160" class="sw-label">DATA_LED[3:0]</text>
  <text x="658" y="175" class="wire-label">io.out (~fsm.io.out)</text>
</svg>
