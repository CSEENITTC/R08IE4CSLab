<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" width="100%" height="100%">
  <style>
    .state { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; filter: url(#shadow); }
    .state-init { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.5; filter: url(#shadow); }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .onehot { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 13px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
    .onehot-init { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 13px; font-weight: 700; fill: #15803d; text-anchor: middle; }
    .edge-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
    .reset-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
    .arrow-line { stroke: #2563eb; stroke-width: 2.2; fill: none; }
    .reset-line { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 5,3; fill: none; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="740" height="230" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Reset input to s0 -->
  <text x="58" y="64" class="reset-label">RESET_SW</text>
  <text x="58" y="80" class="reset-label">(clear = 1)</text>
  <line x1="25" y1="92" x2="102" y2="92" class="reset-line" marker-end="url(#arrow-red)"/>

  <!-- State s0 -->
  <circle cx="150" cy="95" r="44" class="state-init"/>
  <text x="150" y="90" class="title">State.s0</text>
  <text x="150" y="110" class="onehot-init">out = 0001</text>

  <!-- s0 -> s1 -->
  <line x1="194" y1="95" x2="268" y2="95" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="231" y="84" class="edge-label">run開始後</text>

  <!-- State s1 -->
  <circle cx="316" cy="95" r="44" class="state"/>
  <text x="316" y="90" class="title">State.s1</text>
  <text x="316" y="110" class="onehot">out = 0010</text>

  <!-- s1 -> s2 -->
  <line x1="360" y1="95" x2="434" y2="95" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="397" y="84" class="edge-label">次周期</text>

  <!-- State s2 -->
  <circle cx="482" cy="95" r="44" class="state"/>
  <text x="482" y="90" class="title">State.s2</text>
  <text x="482" y="110" class="onehot">out = 0100</text>

  <!-- s2 -> s3 -->
  <line x1="526" y1="95" x2="600" y2="95" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="563" y="84" class="edge-label">次周期</text>

  <!-- State s3 -->
  <circle cx="648" cy="95" r="44" class="state"/>
  <text x="648" y="90" class="title">State.s3</text>
  <text x="648" y="110" class="onehot">out = 1000</text>

  <!-- Loop back s3 -> s0 -->
  <path d="M 648 139 Q 648 195 399 195 Q 150 195 150 142" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="399" y="185" class="edge-label">次周期 (s3 → s0 へ循環遷移)</text>

  <!-- Note at top -->
  <text x="395" y="28" class="edge-label" style="fill:#1e40af; font-weight:700;">RUN_SW (run = 1) 押下で動作開始・4状態を連続巡回 / RESET_SW (clear = 1) で初期状態 s0 (0001) に復帰</text>
</svg>
