<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 145" width="100%" height="100%">
  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
    .wire-label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; fill: #2563eb; font-weight: 600; }
    .wire { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-subtle { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .wire-clk { stroke: #0284c7; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
    .feedback-wire { stroke: #2563eb; stroke-width: 2.2; fill: none; }
    .box-comb { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .box-seq { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.8; rx: 6; filter: url(#shadow); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <filter id="shadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background plate -->
  <rect width="760" height="145" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Left Output from MSB FF(3) -->
  <text x="12" y="54" class="label">out</text>
  <line x1="80" y1="50" x2="42" y2="50" class="wire" marker-end="url(#arrow)"/>

  <!-- 4 Flip Flops: Left is MSB (3), Right is LSB (0) -->
  <rect x="80" y="20" width="110" height="60" class="box-seq"/>
  <text x="135" y="48" class="title" style="fill:#166534;">FF(3)</text>
  <text x="135" y="68" class="subtitle">MSB (bit 3)</text>

  <line x1="240" y1="50" x2="190" y2="50" class="wire" marker-end="url(#arrow)"/>

  <rect x="240" y="20" width="110" height="60" class="box-seq"/>
  <text x="295" y="48" class="title" style="fill:#166534;">FF(2)</text>
  <text x="295" y="68" class="subtitle">bit 2</text>

  <line x1="400" y1="50" x2="350" y2="50" class="wire" marker-end="url(#arrow)"/>

  <rect x="400" y="20" width="110" height="60" class="box-seq"/>
  <text x="455" y="48" class="title" style="fill:#166534;">FF(1)</text>
  <text x="455" y="68" class="subtitle">bit 1</text>

  <line x1="560" y1="50" x2="510" y2="50" class="wire" marker-end="url(#arrow)"/>

  <rect x="560" y="20" width="110" height="60" class="box-seq"/>
  <text x="615" y="48" class="title" style="fill:#166534;">FF(0)</text>
  <text x="615" y="68" class="subtitle">LSB (bit 0)</text>

  <!-- Primary Input into LSB FF(0) from Right -->
  <line x1="710" y1="50" x2="670" y2="50" class="wire" marker-end="url(#arrow)"/>
  <text x="716" y="54" class="wire-label">inBit</text>

  <!-- CLK markers below -->
  <path d="M 130,80 L 135,73 L 140,80" stroke="#0284c7" stroke-width="1.5" fill="none"/>
  <path d="M 290,80 L 295,73 L 300,80" stroke="#0284c7" stroke-width="1.5" fill="none"/>
  <path d="M 450,80 L 455,73 L 460,80" stroke="#0284c7" stroke-width="1.5" fill="none"/>
  <path d="M 610,80 L 615,73 L 620,80" stroke="#0284c7" stroke-width="1.5" fill="none"/>
  <text x="375" y="108" class="wire-label" style="fill:#0284c7;" text-anchor="middle">共通クロック (Clock) 同期駆動：下位ビット (LSB) から上位ビット (MSB) へシフト</text>
  <text x="375" y="128" class="subtitle" text-anchor="middle">shiftReg := Cat(shiftReg(2, 0), io.inBit)</text>

</svg>
