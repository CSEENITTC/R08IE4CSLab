<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
      .wire-label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 12px; fill: #2563eb; font-weight: 600; }
      .wire-label-green { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 12px; fill: #16a34a; font-weight: 600; }
      .wire { stroke: #2563eb; stroke-width: 2.2; fill: none; }
      .wire-out { stroke: #16a34a; stroke-width: 2.2; fill: none; }
      .wire-clk { stroke: #d97706; stroke-width: 2.2; fill: none; stroke-dasharray: 4, 3; }
      .box-tb { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 10; stroke-dasharray: 6, 4; }
      .box-dut { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; rx: 8; filter: url(#shadow); }
      .box-act { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.8; rx: 6; }
      .box-chk { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; rx: 6; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="740" height="240" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Outer Testbench Box -->
  <rect x="20" y="20" width="700" height="200" class="box-tb"/>
  <text x="40" y="44" class="label" style="font-size:13px; fill:#475569;">Testbench (chiseltest: ChiselScalatestTester)</text>

  <!-- Stimulus Driver (poke) -->
  <rect x="50" y="70" width="160" height="60" class="box-act"/>
  <text x="130" y="95" class="title" style="fill:#854d0e;">Stimulus (入力駆動)</text>
  <text x="130" y="115" class="wire-label" style="fill:#a16207;">dut.io.in.poke(...)</text>

  <!-- DUT (Device Under Test) -->
  <rect x="290" y="60" width="180" height="120" class="box-dut"/>
  <text x="380" y="95" class="title" style="fill:#1e3a8a;">DUT (回路モデル)</text>
  <text x="380" y="115" class="subtitle" style="font-size:12px;">class MyModule extends Module</text>
  <text x="380" y="135" class="subtitle" style="font-size:11px; fill:#2563eb;">組合せ論理 / 順序論理 (Reg)</text>
  <text x="380" y="158" class="subtitle" style="font-size:10px; fill:#64748b;">サイクル精度シミュレーション</text>

  <!-- Checker / Monitor (expect / peek) -->
  <rect x="540" y="70" width="160" height="60" class="box-chk"/>
  <text x="620" y="95" class="title" style="fill:#166534;">Check (結果検証)</text>
  <text x="620" y="115" class="wire-label-green">dut.io.out.expect(...)</text>

  <!-- Wire 1: poke to DUT input -->
  <line x1="210" y1="100" x2="290" y2="100" class="wire" marker-end="url(#arrow-blue)"/>
  <text x="250" y="92" class="wire-label" style="text-anchor:middle;">io.in</text>

  <!-- Wire 2: DUT output to expect -->
  <line x1="470" y1="100" x2="540" y2="100" class="wire-out" marker-end="url(#arrow-green)"/>
  <text x="505" y="92" class="wire-label-green" style="text-anchor:middle;">io.out</text>

  <!-- Clock & Step Controller -->
  <line x1="130" y1="130" x2="130" y2="175" class="wire-clk"/>
  <line x1="130" y1="175" x2="290" y2="175" class="wire-clk" marker-end="url(#arrow-amber)"/>
  <text x="210" y="168" class="wire-label" style="fill:#d97706; text-anchor:middle;">dut.clock.step(1)</text>
  <text x="210" y="195" class="subtitle" style="fill:#b45309; text-anchor:middle;">クロック前進と時間同期</text>
</svg>
