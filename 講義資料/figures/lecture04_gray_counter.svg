<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .bold-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; }
      .wire-label { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; font-weight: bold; }
      .sub-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; }
      .wire-pulse { stroke: #d97706; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .wire-data { stroke: #2563eb; stroke-width: 2; fill: none; stroke-linecap: round; }
      .wire-ctrl { stroke: #64748b; stroke-width: 1.6; fill: none; stroke-linecap: round; }
      .box-seq { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.6; rx: 8; }
      .box-comb { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.6; rx: 8; }
      .shadow { filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.06)); }
    </style>
    <marker id="arrow-pulse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="6" y="6" width="748" height="208" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Input Ports -->
  <text x="16" y="75" class="wire-label" fill="#0f172a">io.en</text>
  <text x="16" y="125" class="wire-label" fill="#dc2626">io.clear</text>
  <line x1="65" y1="71" x2="95" y2="71" class="wire-ctrl" marker-end="url(#arrow-ctrl)"/>
  <line x1="65" y1="121" x2="95" y2="121" class="wire-ctrl" marker-end="url(#arrow-ctrl)"/>

  <!-- Module Box: GrayCodeCounter -->
  <g class="shadow" transform="translate(95, 16)">
    <rect x="0" y="0" width="535" height="186" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="535" height="26" rx="10" fill="#eff6ff"/>
    <text x="267" y="18" text-anchor="middle" class="bold-label" fill="#1e40af">GrayCodeCounter (width=4, clkFreq=9MHz) 内部ブロック構成</text>

    <!-- Block 1: 9MHz Divider (cntReg) -->
    <rect x="14" y="38" width="136" height="134" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="82" y="58" text-anchor="middle" class="bold-label" fill="#334155">1. 分周カウンタ</text>
    <text x="82" y="76" text-anchor="middle" class="wire-label" fill="#0f172a">cntReg (24bit)</text>
    <text x="82" y="94" text-anchor="middle" class="sub-label">0 〜 clkFreq-1</text>
    <text x="82" y="114" text-anchor="middle" class="sub-label">clear時: 0.U</text>
    <text x="82" y="132" text-anchor="middle" class="sub-label" fill="#b45309">満了時1クロックHigh:</text>
    <text x="82" y="148" text-anchor="middle" class="wire-label" fill="#d97706">enGrayCodeCounter</text>

    <!-- Block 3: LED Toggler (ledReg) -->
    <rect x="205" y="36" width="312" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="361" y="53" text-anchor="middle" class="bold-label" fill="#b45309">3. LED点滅レジスタ: ledReg (RegInit(false.B))</text>
    <text x="361" y="69" text-anchor="middle" class="sub-label" fill="#78350f">clear時: false.B / 0.5秒(halfPeriod-1, fullPeriod-1)毎に !ledReg</text>

    <!-- Block 2: Binary Counter (binReg) -->
    <rect x="205" y="88" width="140" height="82" class="box-seq"/>
    <text x="275" y="108" text-anchor="middle" class="bold-label" fill="#065f46">2. バイナリカウンタ</text>
    <text x="275" y="126" text-anchor="middle" class="wire-label" fill="#166534">binReg (4bit)</text>
    <text x="275" y="144" text-anchor="middle" class="sub-label">clear時: 0.U</text>
    <text x="275" y="160" text-anchor="middle" class="sub-label" fill="#047857">1秒毎に binReg + 1.U</text>

    <!-- Branch from binReg -->
    <line x1="345" y1="112" x2="517" y2="112" class="wire-data"/>
    <circle cx="362" cy="112" r="3.5" fill="#2563eb"/>
    <line x1="362" y1="112" x2="362" y2="148" class="wire-data"/>
    <line x1="362" y1="148" x2="380" y2="148" class="wire-data" marker-end="url(#arrow-data)"/>

    <!-- Block 4: Gray Code XOR Converter -->
    <rect x="380" y="126" width="137" height="44" class="box-comb"/>
    <text x="448" y="144" text-anchor="middle" class="bold-label" fill="#1e40af" font-size="11.5">4. グレイコード変換</text>
    <text x="448" y="161" text-anchor="middle" class="wire-label" fill="#1d4ed8" font-size="10">gray = binReg ^ (binReg &gt;&gt; 1)</text>

    <!-- Internal connections from Divider -->
    <line x1="150" y1="56" x2="205" y2="56" class="wire-pulse" marker-end="url(#arrow-pulse)"/>
    <text x="177" y="50" text-anchor="middle" class="sub-label" fill="#b45309" font-size="9.5">0.5s反転</text>

    <line x1="150" y1="130" x2="205" y2="130" class="wire-pulse" marker-end="url(#arrow-pulse)"/>
    <text x="177" y="123" text-anchor="middle" class="wire-label" fill="#d97706" font-size="9.5">1Hz en</text>
  </g>

  <!-- Output Ports -->
  <!-- io.runLED -->
  <line x1="612" y1="72" x2="644" y2="72" class="wire-data"/>
  <circle cx="652" cy="72" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="652" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">~</text>
  <line x1="659" y1="72" x2="680" y2="72" class="wire-data" marker-end="url(#arrow-data)"/>
  <text x="685" y="76" class="wire-label" fill="#16a34a">io.runLED</text>

  <!-- io.bin[3:0] -->
  <line x1="612" y1="128" x2="644" y2="128" class="wire-data"/>
  <circle cx="652" cy="128" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="652" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">~</text>
  <line x1="659" y1="128" x2="680" y2="128" class="wire-data" marker-end="url(#arrow-data)"/>
  <text x="685" y="132" class="wire-label" fill="#047857">io.bin[3:0]</text>

  <!-- io.gray[3:0] -->
  <line x1="612" y1="164" x2="644" y2="164" class="wire-data"/>
  <circle cx="652" cy="164" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="652" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">~</text>
  <line x1="659" y1="164" x2="680" y2="164" class="wire-data" marker-end="url(#arrow-data)"/>
  <text x="685" y="168" class="wire-label" fill="#2563eb">io.gray[3:0]</text>
</svg>
