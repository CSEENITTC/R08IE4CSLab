<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="100%" height="100%">
  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
    .wire-label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; fill: #2563eb; font-weight: 600; }
    .wire { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-subtle { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .wire-clk { stroke: #0284c7; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
    .feedback-wire { stroke: #2563eb; stroke-width: 2.2; fill: none; }
    .box-comb { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .box-seq { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.8; rx: 6; filter: url(#shadow); }
    .box-ctrl { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .box-mem { fill: #fff7ed; stroke: #f97316; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .box-bad { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.8; rx: 8; }
    .gate { fill: #ffffff; stroke: #1e40af; stroke-width: 1.8; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arrow-subtle" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background plate -->
  <rect width="760" height="230" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.2"/>

  <rect x="30" y="20" width="700" height="190" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="10"/>
  <text x="380" y="42" class="title" style="font-size:16px; fill:#334155;">Counter60 (60進カウンタ)</text>

  <text x="45" y="75" class="wire-label">io.en</text>
  <line x1="85" y1="70" x2="160" y2="70" class="wire"/>
  <circle cx="160" cy="70" r="3.5" fill="#2563eb"/>
  <line x1="160" y1="70" x2="160" y2="95" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <line x1="160" y1="70" x2="400" y2="70" class="wire"/>
  <line x1="400" y1="70" x2="400" y2="105" class="wire-subtle" marker-end="url(#arrow-subtle)"/>

  <text x="45" y="125" class="wire-label">io.clear</text>
  <line x1="95" y1="120" x2="160" y2="120" class="wire" marker-end="url(#arrow)"/>
  <line x1="140" y1="120" x2="140" y2="140" class="wire"/>
  <line x1="140" y1="140" x2="450" y2="140" class="wire"/>
  <line x1="450" y1="140" x2="450" y2="125" class="wire-subtle" marker-end="url(#arrow-subtle)"/>

  <rect x="160" y="80" width="160" height="70" class="box-seq"/>
  <text x="240" y="108" class="title" style="fill:#166534;">u10 (10進)</text>
  <text x="240" y="126" class="subtitle">ModuloNCounter(10, 4)</text>

  <line x1="320" y1="110" x2="400" y2="110" class="wire"/>
  <circle cx="360" cy="110" r="3.5" fill="#2563eb"/>

  <rect x="390" y="95" width="40" height="30" class="gate"/>
  <text x="410" y="115" class="title" style="font-size:10px;">AND</text>
  <line x1="430" y1="110" x2="460" y2="110" class="wire" marker-end="url(#arrow)"/>

  <rect x="460" y="80" width="160" height="70" class="box-seq"/>
  <text x="540" y="108" class="title" style="fill:#166534;">u6 (6進)</text>
  <text x="540" y="126" class="subtitle">ModuloNCounter(6, 3)</text>

  <line x1="240" y1="150" x2="240" y2="185" class="wire" marker-end="url(#arrow)"/>
  <text x="240" y="200" class="wire-label" text-anchor="middle">io.secUnits (4bit)</text>

  <line x1="540" y1="150" x2="540" y2="185" class="wire" marker-end="url(#arrow)"/>
  <text x="540" y="200" class="wire-label" text-anchor="middle">io.secTens (3bit)</text>

  <path d="M 620,110 L 660,110 L 660,110 L 710,110" class="wire" marker-end="url(#arrow)"/>
  <text x="640" y="102" class="wire-label">io.cout</text>

</svg>