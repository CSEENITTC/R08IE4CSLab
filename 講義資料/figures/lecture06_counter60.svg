<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 235" width="100%" height="100%">
  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #475569; text-anchor: middle; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
    .wire-label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; fill: #2563eb; font-weight: 600; }
    .wire { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-subtle { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .box-seq { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.8; rx: 6; filter: url(#shadow); }
    .box-mem { fill: #fff7ed; stroke: #f97316; stroke-width: 1.8; rx: 6; filter: url(#shadow); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arrow-subtle" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background plate -->
  <rect width="760" height="235" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.2"/>

  <rect x="25" y="18" width="710" height="198" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="10"/>
  <text x="380" y="40" class="title" style="font-size:15px; fill:#334155;">Counter60 (1Hz生成 + 10進 + 6進 階層化60進カウンタ)</text>

  <!-- io.en -->
  <text x="36" y="95" class="wire-label">io.en</text>
  <line x1="72" y1="90" x2="105" y2="90" class="wire" marker-end="url(#arrow)"/>

  <!-- io.clear -->
  <text x="36" y="150" class="wire-label">io.clear</text>
  <line x1="88" y1="145" x2="565" y2="145" class="wire-subtle"/>
  <circle cx="170" cy="145" r="3" fill="#64748b"/>
  <line x1="170" y1="145" x2="170" y2="130" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <circle cx="375" cy="145" r="3" fill="#64748b"/>
  <line x1="375" y1="145" x2="375" y2="130" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <line x1="565" y1="145" x2="565" y2="130" class="wire-subtle" marker-end="url(#arrow-subtle)"/>

  <!-- Submodule 1: oneHz -->
  <rect x="105" y="65" width="140" height="65" class="box-mem"/>
  <text x="175" y="92" class="title" style="fill:#9a3412;">oneHz (1Hz生成)</text>
  <text x="175" y="110" class="subtitle">OneHzGenerator</text>

  <!-- oneHzPulse -> u10.io.en -->
  <line x1="245" y1="97" x2="310" y2="97" class="wire" marker-end="url(#arrow)"/>
  <text x="277" y="88" class="wire-label" text-anchor="middle">oneHzPulse</text>

  <!-- Submodule 2: u10 -->
  <rect x="310" y="65" width="145" height="65" class="box-seq"/>
  <text x="382" y="92" class="title" style="fill:#166534;">u10 (10進カウンタ)</text>
  <text x="382" y="110" class="subtitle">ModuloNCounter(10, 4)</text>

  <!-- u10.io.rollover -> u6.io.en -->
  <line x1="455" y1="97" x2="515" y2="97" class="wire" marker-end="url(#arrow)"/>
  <text x="485" y="88" class="wire-label" text-anchor="middle">rollover</text>

  <!-- Submodule 3: u6 -->
  <rect x="515" y="65" width="145" height="65" class="box-seq"/>
  <text x="587" y="92" class="title" style="fill:#166534;">u6 (6進カウンタ)</text>
  <text x="587" y="110" class="subtitle">ModuloNCounter(6, 3)</text>

  <!-- Outputs -->
  <line x1="145" y1="130" x2="145" y2="185" class="wire" marker-end="url(#arrow)"/>
  <text x="145" y="202" class="wire-label" text-anchor="middle">io.ledBlink</text>

  <line x1="405" y1="130" x2="405" y2="185" class="wire" marker-end="url(#arrow)"/>
  <text x="405" y="202" class="wire-label" text-anchor="middle">io.secUnits (4bit)</text>

  <line x1="595" y1="130" x2="595" y2="185" class="wire" marker-end="url(#arrow)"/>
  <text x="595" y="202" class="wire-label" text-anchor="middle">io.secTens (3bit)</text>

  <line x1="660" y1="97" x2="718" y2="97" class="wire" marker-end="url(#arrow)"/>
  <text x="688" y="88" class="wire-label" text-anchor="middle">io.cout</text>

</svg>
