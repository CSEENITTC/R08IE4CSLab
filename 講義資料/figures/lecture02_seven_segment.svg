<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="100%" height="100%">
  <defs>
    <style>
      .seg-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: bold; fill: #1e40af; text-anchor: middle; }
      .dp-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #64748b; text-anchor: middle; }
      .shadow { filter: drop-shadow(0px 3px 6px rgba(0, 0, 0, 0.08)); }
      .seg { fill: #3b82f6; stroke: #1d4ed8; stroke-width: 1.5; }
      .seg:hover { fill: #2563eb; }
      .dp { fill: #94a3b8; stroke: #64748b; stroke-width: 1.5; }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="400" height="260" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Display Bezel -->
  <rect x="90" y="25" width="220" height="230" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

  <!-- 7-Segment Geometry (Hexagonal Segments) -->
  <!-- Segment a (top) -->
  <polygon points="135,45 145,35 255,35 265,45 255,55 145,55" class="seg"/>
  <text x="200" y="49" class="seg-label" fill="#ffffff">a</text>

  <!-- Segment b (top right) -->
  <polygon points="270,50 280,60 280,125 270,135 260,125 260,60" class="seg"/>
  <text x="270" y="98" class="seg-label" fill="#ffffff">b</text>

  <!-- Segment c (bottom right) -->
  <polygon points="270,145 280,155 280,220 270,230 260,220 260,155" class="seg"/>
  <text x="270" y="193" class="seg-label" fill="#ffffff">c</text>

  <!-- Segment d (bottom) -->
  <polygon points="135,235 145,225 255,225 265,235 255,245 145,245" class="seg"/>
  <text x="200" y="239" class="seg-label" fill="#ffffff">d</text>

  <!-- Segment e (bottom left) -->
  <polygon points="130,145 140,155 140,220 130,230 120,220 120,155" class="seg"/>
  <text x="130" y="193" class="seg-label" fill="#ffffff">e</text>

  <!-- Segment f (top left) -->
  <polygon points="130,50 140,60 140,125 130,135 120,125 120,60" class="seg"/>
  <text x="130" y="98" class="seg-label" fill="#ffffff">f</text>

  <!-- Segment g (middle) -->
  <polygon points="135,140 145,130 255,130 265,140 255,150 145,150" class="seg"/>
  <text x="200" y="144" class="seg-label" fill="#ffffff">g</text>

  <!-- Decimal Point (DP) -->
  <circle cx="295" cy="235" r="7" class="dp"/>
  <text x="295" y="218" class="dp-label">dp</text>

  <!-- Title / Pinout Guides -->
  <text x="50" y="145" class="seg-label" fill="#94a3b8" font-size="12">7セグメント<br/>LED配置</text>
  <text x="350" y="145" class="seg-label" fill="#94a3b8" font-size="11">カソードコモン<br/>/ アノードコモン</text>
</svg>
