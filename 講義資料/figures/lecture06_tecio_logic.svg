<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="100%" height="100%">
  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
    .sw-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #b45309; }
    .wire-label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; fill: #2563eb; font-weight: 600; }
    .wire { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-ctrl { stroke: #d97706; stroke-width: 1.8; fill: none; }
    .box-top { fill: #f8fafc; stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 6,4; rx: 12; }
    .box-seq { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.8; rx: 6; filter: url(#shadow); }
    .box-comb { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .gate { fill: #ffffff; stroke: #1e40af; stroke-width: 1.8; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background plate -->
  <rect width="760" height="250" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Top Module Boundary -->
  <rect x="155" y="15" width="465" height="220" class="box-top"/>
  <text x="245" y="36" class="title" style="fill:#1e40af;">TeCIO (トップモジュール)</text>

  <!-- DATA_SW -> io.wd -->
  <text x="18" y="102" class="sw-label">DATA_SW[7:0]</text>
  <text x="18" y="118" class="wire-label">io.wd (8bit)</text>
  <line x1="115" y1="108" x2="185" y2="108" class="wire"/>
  <circle cx="185" cy="108" r="3.5" fill="#2563eb"/>
  <line x1="185" y1="108" x2="185" y2="68" class="wire"/>
  <line x1="185" y1="68" x2="225" y2="68" class="wire" marker-end="url(#arrow)"/>
  <line x1="185" y1="108" x2="185" y2="152" class="wire"/>
  <line x1="185" y1="152" x2="225" y2="152" class="wire" marker-end="url(#arrow)"/>

  <!-- INC_SW -> io.weA -->
  <text x="18" y="54" class="sw-label">INC_SW (P22)</text>
  <text x="18" y="68" class="wire-label">io.weA</text>
  <line x1="115" y1="56" x2="225" y2="56" class="wire-ctrl" marker-end="url(#arrow-ctrl)"/>

  <!-- DEC_SW -> io.weB -->
  <text x="18" y="166" class="sw-label">DEC_SW (P23)</text>
  <text x="18" y="180" class="wire-label">io.weB</text>
  <line x1="115" y1="168" x2="225" y2="168" class="wire-ctrl" marker-end="url(#arrow-ctrl)"/>

  <!-- regA -->
  <rect x="225" y="45" width="110" height="46" class="box-seq"/>
  <text x="280" y="66" class="title" style="fill:#166534;">regA (8bit)</text>
  <text x="280" y="82" class="subtitle">when(weA)</text>

  <!-- regB -->
  <rect x="225" y="135" width="110" height="46" class="box-seq"/>
  <text x="280" y="156" class="title" style="fill:#166534;">regB (8bit)</text>
  <text x="280" y="172" class="subtitle">when(weB)</text>

  <!-- regA, regB -> LogicUnit -->
  <line x1="335" y1="68" x2="395" y2="68" class="wire"/>
  <line x1="395" y1="68" x2="395" y2="95" class="wire"/>
  <line x1="395" y1="95" x2="420" y2="95" class="wire" marker-end="url(#arrow)"/>
  <text x="368" y="62" class="wire-label">lu.io.a</text>

  <line x1="335" y1="158" x2="395" y2="158" class="wire"/>
  <line x1="395" y1="158" x2="395" y2="130" class="wire"/>
  <line x1="395" y1="130" x2="420" y2="130" class="wire" marker-end="url(#arrow)"/>
  <text x="368" y="152" class="wire-label">lu.io.b</text>

  <!-- LogicUnit -->
  <rect x="420" y="75" width="135" height="75" class="box-comb"/>
  <text x="487" y="102" class="title">LogicUnit (lu)</text>
  <text x="487" y="120" class="subtitle">00:AND 01:OR</text>
  <text x="487" y="136" class="subtitle">10:XOR 11:NOT a</text>

  <!-- BREAK_SW, STEP_SW -> io.op[1:0] -->
  <text x="260" y="216" class="sw-label">BREAK_SW (P14: op[1]), STEP_SW (P15: op[0])</text>
  <line x1="487" y1="202" x2="487" y2="150" class="wire-ctrl" marker-end="url(#arrow-ctrl)"/>
  <text x="495" y="185" class="wire-label">io.op (2bit)</text>

  <!-- Negation (~) and Output to DATA_LED -->
  <line x1="555" y1="112" x2="578" y2="112" class="wire"/>
  <rect x="578" y="98" width="28" height="28" class="gate" rx="4"/>
  <text x="592" y="117" class="title">~</text>
  <line x1="606" y1="112" x2="645" y2="112" class="wire" marker-end="url(#arrow)"/>
  <text x="652" y="106" class="sw-label">DATA_LED[7:0]</text>
  <text x="652" y="122" class="wire-label">io.res (8bit)</text>
</svg>
