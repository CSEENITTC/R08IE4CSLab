<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 12px; font-weight: 600; fill: #334155; }
      .time-label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .grid-line { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 2, 2; }
      .wave-clk { stroke: #d97706; stroke-width: 2.2; fill: none; }
      .wave-a { stroke: #2563eb; stroke-width: 2.2; fill: none; }
      .wave-b { stroke: #0284c7; stroke-width: 2.2; fill: none; }
      .wave-out { stroke: #16a34a; stroke-width: 2.5; fill: none; }
      .cursor { stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 3, 3; }
      .window-bar { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background Plate -->
  <rect width="740" height="230" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Window Header -->
  <rect x="15" y="15" width="710" height="28" rx="6" class="window-bar"/>
  <circle cx="32" cy="29" r="5" fill="#ef4444"/>
  <circle cx="48" cy="29" r="5" fill="#f59e0b"/>
  <circle cx="64" cy="29" r="5" fill="#10b981"/>
  <text x="82" y="33" class="title" style="font-size:12px; fill:#475569;">Surfer Waveform Viewer — test_run_dir/.../And.vcd</text>

  <!-- Time Grid -->
  <line x1="200" y1="50" x2="200" y2="215" class="grid-line"/>
  <line x1="320" y1="50" x2="320" y2="215" class="grid-line"/>
  <line x1="440" y1="50" x2="440" y2="215" class="grid-line"/>
  <line x1="560" y1="50" x2="560" y2="215" class="grid-line"/>
  <line x1="680" y1="50" x2="680" y2="215" class="grid-line"/>

  <!-- Time Labels -->
  <text x="200" y="62" class="time-label">0 ns (Step 0)</text>
  <text x="320" y="62" class="time-label">10 ns (Step 1)</text>
  <text x="440" y="62" class="time-label">20 ns (Step 2)</text>
  <text x="560" y="62" class="time-label">30 ns (Step 3)</text>
  <text x="680" y="62" class="time-label">40 ns (Step 4)</text>

  <!-- Signal 1: clock -->
  <text x="30" y="95" class="label" style="fill:#b45309;">clock</text>
  <path d="M 140 100 L 200 100 L 200 80 L 260 80 L 260 100 L 320 100 L 320 80 L 380 80 L 380 100 L 440 100 L 440 80 L 500 80 L 500 100 L 560 100 L 560 80 L 620 80 L 620 100 L 680 100" class="wave-clk"/>

  <!-- Signal 2: io_a -->
  <text x="30" y="130" class="label" style="fill:#1d4ed8;">io.a</text>
  <path d="M 140 135 L 320 135 L 320 115 L 680 115" class="wave-a"/>

  <!-- Signal 3: io_b -->
  <text x="30" y="165" class="label" style="fill:#0369a1;">io.b</text>
  <path d="M 140 170 L 200 170 L 200 150 L 320 150 L 320 170 L 440 170 L 440 150 L 680 150" class="wave-b"/>

  <!-- Signal 4: io_out -->
  <text x="30" y="200" class="label" style="fill:#15803d; font-weight:700;">io.out</text>
  <path d="M 140 205 L 440 205 L 440 185 L 680 185" class="wave-out"/>

  <!-- Annotation cursor -->
  <line x1="440" y1="65" x2="440" y2="215" class="cursor"/>
  <rect x="445" y="190" width="130" height="22" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
  <text x="510" y="205" class="label" style="font-size:10.5px; fill:#991b1b; text-anchor:middle;">1 &amp; 1 = 1 (High検知)</text>
</svg>
