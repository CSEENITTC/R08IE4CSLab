<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #1e293b; }
      .bold-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .title-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: bold; fill: #1e40af; }
      .wire-label { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12px; font-weight: bold; }
      .sub-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .wire-in { stroke: #2563eb; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .wire-out { stroke: #16a34a; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-valid { stroke: #d97706; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .shadow { filter: drop-shadow(0px 3px 6px rgba(0, 0, 0, 0.06)); }
    </style>
    <marker id="arrow-in" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-out" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-valid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <linearGradient id="encBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect x="10" y="10" width="600" height="200" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Priority Encoder Block -->
  <g class="shadow" transform="translate(190, 30)">
    <rect x="0" y="0" width="220" height="150" rx="12" fill="url(#encBg)" stroke="#3b82f6" stroke-width="2.2"/>
    <text x="110" y="45" text-anchor="middle" class="title-label">Priority Encoder</text>
    <text x="110" y="70" text-anchor="middle" class="bold-label" fill="#1e40af">4 to 2 (優先度付き)</text>
    <text x="110" y="105" text-anchor="middle" class="sub-label">最優先ビット検出回路</text>
    <text x="110" y="125" text-anchor="middle" class="sub-label">in(3) &gt; in(2) &gt; in(1) &gt; in(0)</text>
  </g>

  <!-- Input Wires (Left to Right) -->
  <!-- in(3) -->
  <path d="M 40, 50 L 190, 50" class="wire-in" marker-end="url(#arrow-in)"/>
  <text x="35" y="45" text-anchor="start" class="wire-label" fill="#2563eb">in(3)</text>
  <text x="35" y="60" text-anchor="start" class="sub-label" fill="#dc2626" font-weight="bold">【最高優先】</text>

  <!-- in(2) -->
  <path d="M 40, 85 L 190, 85" class="wire-in" marker-end="url(#arrow-in)"/>
  <text x="35" y="80" text-anchor="start" class="wire-label" fill="#2563eb">in(2)</text>

  <!-- in(1) -->
  <path d="M 40, 120 L 190, 120" class="wire-in" marker-end="url(#arrow-in)"/>
  <text x="35" y="115" text-anchor="start" class="wire-label" fill="#2563eb">in(1)</text>

  <!-- in(0) -->
  <path d="M 40, 155 L 190, 155" class="wire-in" marker-end="url(#arrow-in)"/>
  <text x="35" y="150" text-anchor="start" class="wire-label" fill="#2563eb">in(0)</text>
  <text x="35" y="165" text-anchor="start" class="sub-label" fill="#64748b">【最低優先】</text>

  <!-- Output Wires (Left to Right) -->
  <!-- pos (2bit) -->
  <path d="M 410, 75 L 560, 75" class="wire-out" marker-end="url(#arrow-out)"/>
  <text x="565" y="70" text-anchor="start" class="wire-label" fill="#16a34a">pos (UInt(2.W))</text>
  <text x="565" y="87" text-anchor="start" class="sub-label" fill="#15803d">優先入力番号 (0〜3)</text>

  <!-- valid (1bit) -->
  <path d="M 410, 135 L 560, 135" class="wire-valid" marker-end="url(#arrow-valid)"/>
  <text x="565" y="130" text-anchor="start" class="wire-label" fill="#d97706">valid (Bool)</text>
  <text x="565" y="147" text-anchor="start" class="sub-label" fill="#b45309">有効要求あり (in.orR)</text>
</svg>
