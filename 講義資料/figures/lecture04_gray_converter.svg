<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" width="100%" height="100%">
  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
    .wire-label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; fill: #2563eb; font-weight: 600; }
    .wire { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-subtle { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .wire-clk { stroke: #0284c7; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
    .feedback-wire { stroke: #2563eb; stroke-width: 2.2; fill: none; }
    .box-comb { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .box-seq { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.8; rx: 6; filter: url(#shadow); }
    .box-ctrl { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .box-mem { fill: #fff7ed; stroke: #f97316; stroke-width: 1.8; rx: 8; filter: url(#shadow); }
    .box-bad { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.8; rx: 8; }
    .gate { fill: #ffffff; stroke: #1e40af; stroke-width: 1.8; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arrow-subtle" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background plate -->
  <rect width="660" height="200" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.2"/>

  <text x="30" y="35" class="wire-label">bin(3)</text>
  <line x1="75" y1="30" x2="540" y2="30" class="wire" marker-end="url(#arrow)"/>
  <circle cx="200" cy="30" r="3.5" fill="#2563eb"/>
  <text x="550" y="35" class="label">gray(3) = bin(3)</text>

  <text x="30" y="80" class="wire-label">bin(2)</text>
  <line x1="75" y1="75" x2="300" y2="75" class="wire"/>
  <circle cx="300" cy="75" r="3.5" fill="#2563eb"/>
  <!-- XOR 2 -->
  <line x1="200" y1="30" x2="200" y2="65" class="wire-subtle"/>
  <line x1="200" y1="65" x2="230" y2="65" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <line x1="75" y1="75" x2="230" y2="75" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <rect x="230" y="55" width="50" height="30" class="gate"/>
  <text x="255" y="75" class="title" style="font-size:11px;">XOR</text>
  <line x1="280" y1="70" x2="540" y2="70" class="wire" marker-end="url(#arrow)"/>
  <text x="550" y="75" class="label">gray(2) = bin(3) ^ bin(2)</text>

  <text x="30" y="125" class="wire-label">bin(1)</text>
  <!-- XOR 1 -->
  <line x1="300" y1="75" x2="300" y2="110" class="wire-subtle"/>
  <line x1="300" y1="110" x2="330" y2="110" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <line x1="75" y1="120" x2="330" y2="120" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <circle cx="400" cy="120" r="3.5" fill="#2563eb"/>
  <rect x="330" y="100" width="50" height="30" class="gate"/>
  <text x="355" y="120" class="title" style="font-size:11px;">XOR</text>
  <line x1="380" y1="115" x2="540" y2="115" class="wire" marker-end="url(#arrow)"/>
  <text x="550" y="120" class="label">gray(1) = bin(2) ^ bin(1)</text>

  <text x="30" y="170" class="wire-label">bin(0)</text>
  <!-- XOR 0 -->
  <line x1="400" y1="120" x2="400" y2="155" class="wire-subtle"/>
  <line x1="400" y1="155" x2="430" y2="155" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <line x1="75" y1="165" x2="430" y2="165" class="wire-subtle" marker-end="url(#arrow-subtle)"/>
  <rect x="430" y="145" width="50" height="30" class="gate"/>
  <text x="455" y="165" class="title" style="font-size:11px;">XOR</text>
  <line x1="480" y1="160" x2="540" y2="160" class="wire" marker-end="url(#arrow)"/>
  <text x="550" y="165" class="label">gray(0) = bin(1) ^ bin(0)</text>

</svg>