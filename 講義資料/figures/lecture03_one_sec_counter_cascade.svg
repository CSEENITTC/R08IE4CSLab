<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #1e293b; }
      .bold-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .wire-label { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12px; font-weight: bold; }
      .sub-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .wire-pulse { stroke: #d97706; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-clk { stroke: #dc2626; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 4,3; }
      .wire-data { stroke: #2563eb; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .shadow { filter: drop-shadow(0px 3px 6px rgba(0, 0, 0, 0.06)); }
    </style>
    <marker id="arrow-pulse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-clk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="10" y="10" width="700" height="230" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Module Box: ModuloNCounter (内部構造) -->
  <g class="shadow" transform="translate(30, 40)">
    <rect x="0" y="0" width="650" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="650" height="28" rx="10" fill="#eff6ff"/>
    <text x="325" y="19" text-anchor="middle" class="bold-label" fill="#1e40af">ModuloNCounter (n=10, clkFreq=9MHz) 内部ブロック構成</text>

    <!-- Sub-block 1: 9MHz Divider -->
    <rect x="20" y="40" width="180" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="110" y="60" text-anchor="middle" class="bold-label" fill="#334155" font-size="12">9MHz分周カウンタ</text>
    <text x="110" y="78" text-anchor="middle" class="sub-label">cntReg (24bit)</text>
    <text x="110" y="96" text-anchor="middle" class="sub-label">0 〜 8,999,999</text>

    <!-- Sub-block 2: LED Toggler -->
    <rect x="230" y="40" width="170" height="42" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="315" y="58" text-anchor="middle" class="bold-label" fill="#b45309" font-size="11">LED反転レジスタ (ledReg)</text>
    <text x="315" y="72" text-anchor="middle" class="sub-label" fill="#78350f">0.5秒毎に反転</text>

    <!-- Sub-block 3: Modulo-N Counter -->
    <rect x="230" y="88" width="170" height="42" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="315" y="106" text-anchor="middle" class="bold-label" fill="#065f46" font-size="11">モジュロNレジスタ (modReg)</text>
    <text x="315" y="120" text-anchor="middle" class="sub-label" fill="#047857">1秒毎に +1 (0〜n-1)</text>

    <!-- Inverters & Output Drivers -->
    <g transform="translate(440, 48)">
      <circle cx="15" cy="8" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="15" y="12" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">~</text>
      <text x="30" y="12" class="wire-label" fill="#16a34a">io.runLED (負論理点滅)</text>
    </g>
    <g transform="translate(440, 96)">
      <circle cx="15" cy="8" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="15" y="12" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">~</text>
      <text x="30" y="12" class="wire-label" fill="#2563eb">io.count (負論理 0〜9)</text>
    </g>

    <!-- Internal Wires -->
    <path d="M 200, 60 L 230, 60" class="wire-data"/>
    <path d="M 200, 105 L 230, 105" class="wire-pulse" marker-end="url(#arrow-pulse)"/>
    <path d="M 400, 56 L 438, 56" class="wire-data"/>
    <path d="M 400, 104 L 438, 104" class="wire-data"/>
  </g>

  <!-- Note Footer -->
  <text x="360" y="222" text-anchor="middle" class="sub-label" font-weight="bold" fill="#334155">
    単一クロック完全同期設計: 内部9MHz分周で1秒ストローブ (modEn) を生成し、1秒ごとに安全にカウントアップ
  </text>
</svg>
