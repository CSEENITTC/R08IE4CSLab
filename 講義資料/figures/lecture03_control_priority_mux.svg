<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #1e293b; }
      .bold-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .wire-label { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12px; font-weight: bold; }
      .sub-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .wire { stroke: #2563eb; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-out { stroke: #16a34a; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .ctrl-wire { stroke: #dc2626; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 4,3; }
      .ctrl-wire2 { stroke: #2563eb; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 4,3; }
      .shadow { filter: drop-shadow(0px 3px 6px rgba(0, 0, 0, 0.06)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-out" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-ctrl1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-ctrl2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="10" y="10" width="660" height="210" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== MUX 2: en (通常動作) ==================== -->
  <g class="shadow" transform="translate(190, 45)">
    <!-- Trapezoid for MUX -->
    <polygon points="0,0 50,15 50,75 0,90" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="25" y="45" text-anchor="middle" class="bold-label" fill="#1d4ed8" font-size="12">MUX 2</text>
    <text x="25" y="60" text-anchor="middle" class="sub-label" fill="#1e40af" font-size="10">(en)</text>
    <text x="8" y="25" class="sub-label" font-size="10">1</text>
    <text x="8" y="75" class="sub-label" font-size="10">0</text>
  </g>

  <!-- Inputs to MUX 2 -->
  <path d="M 30, 60 L 190, 60" class="wire" marker-end="url(#arrow)"/>
  <text x="25" y="55" class="wire-label" fill="#2563eb">next (インクリメント/0復帰)</text>

  <path d="M 30, 115 L 190, 115" class="wire" marker-end="url(#arrow)"/>
  <text x="25" y="110" class="wire-label" fill="#64748b">cntReg (値保持)</text>

  <!-- Control signal: en (上から) -->
  <path d="M 215, 15 L 215, 52" class="ctrl-wire2" marker-end="url(#arrow-ctrl2)"/>
  <text x="215" y="12" text-anchor="middle" class="wire-label" fill="#2563eb">io.en</text>
  <text x="215" y="32" text-anchor="middle" class="sub-label" fill="#1d4ed8">【通常動作】</text>

  <!-- ==================== MUX 1: clear (最優先) ==================== -->
  <g class="shadow" transform="translate(390, 70)">
    <polygon points="0,0 50,15 50,75 0,90" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="25" y="45" text-anchor="middle" class="bold-label" fill="#b91c1c" font-size="12">MUX 1</text>
    <text x="25" y="60" text-anchor="middle" class="sub-label" fill="#7f1d1d" font-size="10">(clear)</text>
    <text x="8" y="25" class="sub-label" font-size="10">1</text>
    <text x="8" y="75" class="sub-label" font-size="10">0</text>
  </g>

  <!-- MUX 2 output to MUX 1 in0 -->
  <path d="M 240, 90 L 315, 90 L 315, 135 L 390, 135" class="wire" marker-end="url(#arrow)"/>

  <!-- Clear 0.U input to MUX 1 in1 -->
  <path d="M 280, 85 L 390, 85" class="wire" marker-end="url(#arrow)"/>
  <text x="270" y="80" text-anchor="end" class="wire-label" fill="#dc2626">0.U (同期リセット)</text>

  <!-- Control signal: clear (上から) -->
  <path d="M 415, 25 L 415, 77" class="ctrl-wire" marker-end="url(#arrow-ctrl1)"/>
  <text x="415" y="20" text-anchor="middle" class="wire-label" fill="#dc2626">io.clear</text>
  <text x="415" y="45" text-anchor="middle" class="sub-label" fill="#991b1b" font-weight="bold">【最優先】</text>

  <!-- ==================== Final Output ==================== -->
  <path d="M 440, 115 L 530, 115" class="wire-out" marker-end="url(#arrow-out)"/>
  <g class="shadow" transform="translate(530, 90)">
    <rect x="0" y="0" width="125" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="62" y="25" text-anchor="middle" class="bold-label" fill="#065f46">次状態レジスタ</text>
    <text x="62" y="42" text-anchor="middle" class="sub-label" fill="#047857">cntReg.D</text>
  </g>

  <!-- Priority Annotation footer -->
  <text x="340" y="205" text-anchor="middle" class="sub-label" font-weight="bold" fill="#475569">
    優先順位階層: clear (最優先: 0強制リセット) &gt; en (通常動作: 周期カウント/値保持)
  </text>
</svg>
