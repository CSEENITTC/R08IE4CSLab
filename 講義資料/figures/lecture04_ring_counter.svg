<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 165" width="100%" height="100%">
  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
    .wire-label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; fill: #2563eb; font-weight: 600; }
    .wire { stroke: #2563eb; stroke-width: 2; fill: none; }
    .feedback-wire { stroke: #2563eb; stroke-width: 2.2; fill: none; }
    .box-seq { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.8; rx: 6; filter: url(#shadow); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <filter id="shadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background plate -->
  <rect width="740" height="165" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- 4 Flip Flops: Left to Right = bit 3 (MSB), bit 2, bit 1, bit 0 (LSB) -->
  <rect x="70" y="20" width="110" height="60" class="box-seq"/>
  <text x="125" y="48" class="title" style="fill:#166534;">FF(3)</text>
  <text x="125" y="68" class="subtitle">MSB (初期値 0)</text>

  <!-- Shift arrow: FF(2) -> FF(3) -->
  <line x1="230" y1="50" x2="180" y2="50" class="wire" marker-end="url(#arrow)"/>

  <rect x="230" y="20" width="110" height="60" class="box-seq"/>
  <text x="285" y="48" class="title" style="fill:#166534;">FF(2)</text>
  <text x="285" y="68" class="subtitle">bit 2 (初期値 0)</text>

  <!-- Shift arrow: FF(1) -> FF(2) -->
  <line x1="390" y1="50" x2="340" y2="50" class="wire" marker-end="url(#arrow)"/>

  <rect x="390" y="20" width="110" height="60" class="box-seq"/>
  <text x="445" y="48" class="title" style="fill:#166534;">FF(1)</text>
  <text x="445" y="68" class="subtitle">bit 1 (初期値 0)</text>

  <!-- Shift arrow: FF(0) -> FF(1) -->
  <line x1="550" y1="50" x2="500" y2="50" class="wire" marker-end="url(#arrow)"/>

  <rect x="550" y="20" width="110" height="60" class="box-seq"/>
  <text x="605" y="48" class="title" style="fill:#166534;">FF(0)</text>
  <text x="605" y="68" class="subtitle">LSB (1-hot 初期値 1)</text>

  <!-- FEEDBACK FROM MSB (FF3 on Left) TO LSB (FF0 on Right) -->
  <path d="M 70,50 L 35,50 L 35,130 L 695,130 L 695,50 L 660,50" class="feedback-wire" marker-end="url(#arrow)"/>
  <rect x="200" y="118" width="330" height="24" fill="#ffffff" rx="4" stroke="#bfdbfe"/>
  <text x="365" y="134" class="wire-label" text-anchor="middle">循環帰還 (D0 &lt;= Q3 : MSB から LSB へ帰還)</text>

</svg>
